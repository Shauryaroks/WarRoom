[project]
name = "server"
version = "0.1.0"
description = "WarRoom - Business Simulation Game Backend"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.135.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "websockets>=12.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
