name: Deploy Backend

on:
  push:
    branches: [master]
    paths-ignore:
      - "client/**"
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JWT_SECRET,OPENROUTER_API_KEY,CORS_ALLOW_ORIGINS
          script: |
            set -e

            APP_DIR=${{ secrets.DEPLOY_PATH }}

            echo "→ Ensuring app directory"
            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ ! -d ".git" ]; then
              echo "→ First-time clone"
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} .
            else
              echo "→ Updating repo"
              git fetch origin master
              git reset --hard origin/master
            fi

            echo "→ Writing server/.env from GitHub secrets"
            # Source of truth is GitHub Secrets; .env.example stays safe (no real values).
            # This overwrites .env every deploy — DB/Redis hostnames are container-internal
            # and never change; all real credentials live in secrets.
            if [ -z "$JWT_SECRET" ] || [ -z "$OPENROUTER_API_KEY" ]; then
              echo "✗ Missing required secrets (JWT_SECRET, OPENROUTER_API_KEY). Aborting."
              exit 1
            fi
            cat > server/.env <<ENV
            DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/complex
            REDIS_URL=redis://redis:6379/0
            JWT_SECRET=${JWT_SECRET}
            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
            CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
            ENV
            chmod 600 server/.env

            echo "→ Building services"
            docker compose build api worker

            echo "→ Starting containers"
            docker compose up -d

            echo "→ Pruning images"
            docker image prune -f
