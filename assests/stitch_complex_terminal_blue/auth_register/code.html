<form class="space-y-6">
<!-- Team Name -->
<div class="space-y-1">
<label class="font-mono text-[10px] text-primary uppercase font-bold tracking-tighter">
                        Field_01 // TEAM_NAME
                    </label>
<input class="w-full bg-surface-container h-11 px-4 border-0 text-sm text-on-surface placeholder:text-outline-variant font-body" placeholder="Enter organizational name..." type="text"/>
</div>
<!-- Ticker Symbol -->
<div class="space-y-1">
<label class="font-mono text-[10px] text-primary uppercase font-bold tracking-tighter">
                        Field_02 // TICKER_SYMBOL
                    </label>
<div class="relative">
<input class="w-full bg-surface-container h-11 px-4 border-0 text-sm text-secondary placeholder:text-outline-variant font-mono uppercase tracking-[0.2em]" maxlength="5" placeholder="e.g. KNTIC" type="text"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 font-mono text-[8px] text-outline-variant">

                        </div>
</div>
</div>
<!-- Email -->
<div class="space-y-1">
<label class="font-mono text-[10px] text-primary uppercase font-bold tracking-tighter">
                        Field_03 // AUTH_EMAIL
                    </label>
<input class="w-full bg-surface-container h-11 px-4 border-0 text-sm text-on-surface placeholder:text-outline-variant font-body" placeholder="admin@terminal.local" type="email"/>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-mono text-[10px] text-primary uppercase font-bold tracking-tighter">
                        Field_04 // ACCESS_KEY
                    </label>
<input class="w-full bg-surface-container h-11 px-4 border-0 text-sm text-on-surface placeholder:text-outline-variant font-body" placeholder="••••••••••••" type="password"/>
</div>

<button class="milled-metal-btn w-full h-12 text-on-primary font-headline font-black text-xs uppercase tracking-[0.15em] transition-all active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
                        Register Team
                        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="flex items-center justify-between pt-2 border-t border-outline-variant/20">
